name: build

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

# Two jobs, deliberately separate: the Python core has no Android dependency and
# should not be blocked by a Gradle download, and a failure in one should not
# hide the result of the other.
jobs:
  python-core:
    name: Python core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest -v

      # The Kotlin client is validated against vectors/cross_language.json, so a
      # stale vector file would let the two implementations drift apart silently.
      - name: Verify the cross-language vectors are current
        run: |
          python -m hyperion.tools.gen_vectors
          if [ -n "$(git status --porcelain vectors/)" ]; then
            echo "::error::vectors/cross_language.json is stale; regenerate and commit it"
            git --no-pager diff -- vectors/
            exit 1
          fi
          echo "vectors are current"

      - name: Verify the CLI runs
        run: |
          python -m hyperion hello --sni blocked.example
          python -m hyperion keygen
          # A dry run must exit non-zero: it proves nothing was verified.
          if python -m hyperion run --dry-run; then
            echo "::error::an unverified dry run reported success"
            exit 1
          fi

  android:
    name: Android unit tests and APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # These are the tests that matter most: they assert the Kotlin crypto and
      # DNS encoders against values generated by the Python core.
      - name: Run JVM unit tests
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --continue testDebugUnitTest 2>&1 | tee /tmp/gradle-unit-tests.log

      # Runner logs live on the Actions blob host, which is not reachable from
      # every environment, and step summaries are not exposed through the REST
      # API. Check-run *annotations* are, so surface each failure as one.
      - name: Publish failure detail as annotations
        if: failure()
        working-directory: android
        shell: bash
        run: |
          shopt -s nullglob
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET

          def emit(level, title, message):
              # Annotation messages are single-line; keep them short and readable.
              flat = " ".join(str(message).split())[:1500]
              print(f"::{level} title={title}::{flat}")

          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))
          if not files:
              emit("error", "no test results", "Gradle produced no JUnit XML; the failure is a compile or configuration error")

          for path in files:
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  for kind in ("failure", "error"):
                      for node in case.findall(kind):
                          detail = node.get("message") or (node.text or "").strip()
                          emit("error", f"{case.get('classname')}.{case.get('name')}", detail)

          # Compile errors never reach the XML, so mirror the Gradle diagnostics.
          try:
              log = open("/tmp/gradle-unit-tests.log", errors="replace").read()
          except OSError:
              log = ""
          for line in log.splitlines():
              if re.search(r"(^|\s)e: |error:|FAILURE:|What went wrong|Could not resolve|Unresolved reference", line):
                  emit("error", "gradle", line.strip())
          PY

      - name: Build the debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publish the APK
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
